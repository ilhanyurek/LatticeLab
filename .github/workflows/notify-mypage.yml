name: mypage'i haberdar et

# LatticeLab main'e her guncellendiginde ilhanyurek/mypage reposundaki
# "Sync LatticeLab" workflow'unu tetikler; o da ilhanyurek.com/lab/ altindaki
# gomulu kopyayi yeniden derleyip commit'ler.
#
# Calismasi icin repo ayarlarindan MYPAGE_DISPATCH_TOKEN secret'i gerekir:
# ilhanyurek/mypage uzerinde "contents: write" yetkisi olan bir fine-grained
# personal access token. Secret tanimli degilse adim sessizce atlanir.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch gonder
        env:
          TOKEN: ${{ secrets.MYPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "MYPAGE_DISPATCH_TOKEN tanimli degil; mypage tetiklenmedi."
            echo "mypage reposunda Actions > Sync LatticeLab elle calistirilabilir."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ilhanyurek/mypage/dispatches \
            -d '{"event_type":"latticelab-updated"}'
          echo "mypage tetiklendi."
