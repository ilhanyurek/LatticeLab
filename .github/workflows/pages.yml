name: GitHub Pages

# Uygulamayi https://ilhanyurek.github.io/LatticeLab/ adresinde yayinlar.
# Amaci, siteye gomulu kopyadan bagimsiz, tek basina paylasilabilir bir
# baglanti saglamak (ornegin APK/EXE ile birlikte bir klasorde).
#
# Repodaki index.html lang="tr" oldugu icin bu surum Turkce acilir; dil
# ayarlardan degistirilebilir. (ilhanyurek.com/lab/ kopyasini mypage'teki
# senkron betigi lang="en" ile uretir, o yuzden orada Ingilizce acilir.)
#
# TEK SEFERLIK AYAR: repo ayarlarindan Pages acik olmali.
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
# Bunu workflow kendisi yapamaz: GITHUB_TOKEN'in Pages sitesi *olusturma*
# yetkisi yoktur ("Resource not accessible by integration"). Ayar bir kez
# yapildiktan sonra her push'ta kendiliginden yayinlanir.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Yayin sirasi korunur; calisan bir yayin yarida kesilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # base, github.io altindaki repo adiyla ayni olmali
      - run: npx vite build --base=/LatticeLab/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
