name: Android APK Derle

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıklar
        run: npm ci

      - name: Web yapısını derle (Vite)
        run: npm run build

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Capacitor senkronize et
        run: npx cap sync android

      - name: APK derle (imzali release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: APK'yı yükle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Miller-3B-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
